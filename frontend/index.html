<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="WellPlayed: watch anything together. Synced playback, chat in your own language, and modes for movie nights, study groups, sports and hangouts." />
    <meta name="theme-color" content="#151d2b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>WellPlayed: watch anything together</title>
    <script>
      // Apply the saved theme before first paint (main.tsx keeps it in sync afterwards).
      try {
        var s = JSON.parse(localStorage.getItem("wp:settings") || "{}");
        var t = s.theme === "light" || s.theme === "dark" ? s.theme : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f3f1e9" : "#151d2b");
        if (s.reduceMotion === true) document.documentElement.classList.add("reduce-motion");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
